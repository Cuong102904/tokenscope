[package]
name = "agent-usage"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "json"] }
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
ratatui = "0.30.2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "macros"] }
toml = "1.2.0"
walkdir = "2.5.0"

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
