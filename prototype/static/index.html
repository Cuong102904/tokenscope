<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Usage</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --ink:#1c1c1a; --mute:#6b6b66; --line:#e4e4df; --accent:#c4501d; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161615; --card:#1f1f1d; --ink:#ecece8; --mute:#9a9a93; --line:#2f2f2b; --accent:#e8794a; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif; }
  .wrap { max-width:1200px; margin:0 auto; padding:20px 16px 60px; }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; margin-bottom:16px; }
  h1 { font-size:20px; margin:0; }
  .filters { display:flex; flex-wrap:wrap; gap:8px; }
  select { background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:6px 8px; font:inherit; }
  .note { color:var(--mute); font-size:12px; margin:0 0 16px; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .kpi .v { font-size:22px; font-weight:600; }
  .kpi .l { color:var(--mute); font-size:12px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }
  @media (max-width:800px) { .grid { grid-template-columns:1fr; } }
  h2 { font-size:14px; margin:0 0 10px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
  h2 .t { color:var(--mute); font-weight:400; font-size:12px; }
  .collapsed .body { display:none; }
  .chart { position:relative; height:260px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:right; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th:first-child, td:first-child { text-align:left; white-space:normal; word-break:break-word; }
  th { color:var(--mute); font-weight:500; }
  .scroll { overflow-x:auto; }
  .warn { color:var(--accent); }
  #status { color:var(--mute); font-size:12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Agent Usage</h1>
    <div class="filters">
      <select id="days"><option value="1">Today</option><option value="7">7 days</option><option value="30" selected>30 days</option><option value="90">90 days</option><option value="0">All time</option></select>
      <select id="model"><option value="">All models</option></select>
      <select id="project"><option value="">All projects</option></select>
    </div>
  </header>
  <p class="note">Costs are API-equivalent estimates from token counts. On a subscription plan you are not billed per token. <span id="status"></span></p>
  <div id="warn" class="note warn"></div>

  <div class="kpis" id="kpis"></div>

  <section class="card" data-sec="daily" style="margin-bottom:12px"><h2>Daily cost by model <span class="t">click to collapse</span></h2><div class="body"><div class="chart"><canvas id="cDaily"></canvas></div></div></section>

  <div class="grid">
    <section class="card" data-sec="models"><h2>By model</h2><div class="body scroll"><table id="tModels"></table></div></section>
    <section class="card" data-sec="projects"><h2>By project</h2><div class="body"><div class="chart"><canvas id="cProj"></canvas></div></div></section>
  </div>

  <section class="card" data-sec="sessions" style="margin-bottom:12px"><h2>Most expensive sessions</h2><div class="body scroll"><table id="tSess"></table></div></section>

  <section class="card" data-sec="omni" id="omniCard" hidden><h2>Omnigent sessions <span class="t">includes non-Claude models; separate source</span></h2><div class="body scroll"><div id="omniTotals" class="note"></div><table id="tOmni"></table></div></section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = v => '$' + v.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
const num = v => v.toLocaleString();
const PALETTE = ['#c4501d','#2f7fb5','#5a9e4b','#a05bb5','#d6a21f','#3aa6a0','#c44b7a','#7a7a72'];
let charts = {};

// URL-bookmarkable filters + remembered collapsed sections
const params = new URLSearchParams(location.search);
for (const k of ['days','model','project']) if (params.has(k)) $(k).value = params.get(k);
function saveParams() {
  const p = new URLSearchParams();
  for (const k of ['days','model','project']) if ($(k).value) p.set(k, $(k).value);
  history.replaceState(null, '', '?' + p);
}
let collapsed = new Set();
try { collapsed = new Set(JSON.parse(localStorage.getItem('au-collapsed') || '[]')); } catch (e) {}
document.querySelectorAll('section[data-sec]').forEach(sec => {
  if (collapsed.has(sec.dataset.sec)) sec.classList.add('collapsed');
  sec.querySelector('h2').addEventListener('click', () => {
    sec.classList.toggle('collapsed');
    sec.classList.contains('collapsed') ? collapsed.add(sec.dataset.sec) : collapsed.delete(sec.dataset.sec);
    try { localStorage.setItem('au-collapsed', JSON.stringify([...collapsed])); } catch (e) {}
  });
});

function fillSelect(sel, values, current) {
  const have = new Set([...sel.options].map(o => o.value));
  values.forEach(v => { if (!have.has(v)) sel.add(new Option(v, v)); });
  sel.value = current;
}
function draw(id, cfg) {
  if (charts[id]) charts[id].destroy();
  charts[id] = new Chart($(id), cfg);
}
const axisColor = () => getComputedStyle(document.documentElement).getPropertyValue('--mute').trim();

function table(el, head, rows) {
  el.innerHTML = '<thead><tr>' + head.map(h => `<th>${esc(h)}</th>`).join('') + '</tr></thead><tbody>' +
    rows.map(r => '<tr>' + r.map(c => `<td>${esc(c)}</td>`).join('') + '</tr>').join('') + '</tbody>';
}

async function load() {
  saveParams();
  const q = new URLSearchParams({days:$('days').value, model:$('model').value, project:$('project').value});
  $('status').textContent = 'loading…';
  let d;
  try { d = await (await fetch('/api/data?' + q)).json(); }
  catch (e) { $('status').textContent = 'failed to load'; return; }
  $('status').textContent = 'updated ' + new Date().toLocaleTimeString();

  fillSelect($('model'), d.models.map(m => m.model), $('model').value);
  fillSelect($('project'), d.projects.map(p => p.project), $('project').value);
  $('warn').textContent = d.unpriced.length ? 'No price entry for: ' + d.unpriced.join(', ') + ' (counted as $0 — edit pricing.py)' : '';

  const t = d.totals;
  $('kpis').innerHTML = [
    ['Estimated cost', money(t.cost)], ['Sessions', num(t.sessions)], ['Messages', num(t.messages)],
    ['Output tokens', num(t.output)], ['Cache read', num(t.cache_read)], ['Cache write', num(t.cache_write)],
  ].map(([l, v]) => `<div class="card kpi"><div class="v">${esc(v)}</div><div class="l">${esc(l)}</div></div>`).join('');

  const modelNames = [...new Set(d.daily.flatMap(x => Object.keys(x.models)))];
  const color = i => PALETTE[i % PALETTE.length];
  const muted = axisColor();
  draw('cDaily', {type:'bar',
    data:{labels:d.daily.map(x => x.day), datasets: modelNames.map((m, i) => ({label:m, backgroundColor:color(i), data:d.daily.map(x => x.models[m] || 0)}))},
    options:{responsive:true, maintainAspectRatio:false, scales:{x:{stacked:true, ticks:{color:muted}}, y:{stacked:true, ticks:{color:muted, callback:v => '$' + v}}},
             plugins:{legend:{labels:{color:muted}}, tooltip:{callbacks:{label:c => c.dataset.label + ': ' + money(c.parsed.y)}}}}});

  table($('tModels'), ['Model','Cost','Messages','Input','Output','Cache read','Cache write'],
    d.models.map(m => [m.model, m.priced ? money(m.cost) : 'n/a', num(m.messages), num(m.input), num(m.output), num(m.cache_read), num(m.cache_write)]));

  draw('cProj', {type:'bar',
    data:{labels:d.projects.slice(0,10).map(p => p.project), datasets:[{label:'Cost', backgroundColor:color(0), data:d.projects.slice(0,10).map(p => p.cost)}]},
    options:{indexAxis:'y', responsive:true, maintainAspectRatio:false, scales:{x:{ticks:{color:muted, callback:v => '$' + v}}, y:{ticks:{color:muted}}},
             plugins:{legend:{display:false}, tooltip:{callbacks:{label:c => money(c.parsed.x)}}}}});

  table($('tSess'), ['Project','Cost','Messages','Subagent msgs','Models','First','Last'],
    d.sessions.map(s => [s.project, money(s.cost), num(s.messages), num(s.sidechain), s.models.join(', '), s.first, s.last]));

  const o = d.omnigent;
  $('omniCard').hidden = !o;
  if (o) {
    $('omniTotals').textContent = `Today ${money(o.cost_today||0)} · 7d ${money(o.cost_last_7d||0)} · 30d ${money(o.cost_last_30d||0)} · all ${money(o.total_cost_usd||0)} (Omnigent's own estimate)`;
    table($('tOmni'), ['Session','Cost','By model'],
      (o.sessions||[]).map(s => [s.title || s.id, money(s.cost_usd || 0),
        Object.entries(s.models||{}).map(([k, v]) => k + ' ' + money(v)).join(' · ')]));
  }
}
['days','model','project'].forEach(k => $(k).addEventListener('change', load));
load();
setInterval(load, 30000);
</script>
</body>
</html>
